  glock: [0, -1], superTir: [-0.95, -1.55], mp5: [0, -2], benelli: [-0.9, -3], hk416: [0.9, -3], m32: [-1.5, -4], m2flame: [-0.45, -4], scar: [0.5, -4], minimi: [1.5, -4], carlg: [-1.5, -5], hecate: [0.5, -5], shmel: [-1, -6],
  sniper: [1.15, 0], sniper2: [1.6, 0.95], sniper3: [2.45, 1.55], mortar: [2.3, 0], mortar2: [3.4, 0], mortar3: [4.5, 0], arty: [3.1, -0.95],
  wire: [0, 1.1], wire2: [0, 2.25], wire3: [0, 3.4], mine: [-1.0, 2.1], mine2: [-1.9, 2.7], mine3: [-2.8, 3.1], ditch: [1.0, 2.1], ditch2: [2.0, 2.6], ditch3: [3.0, 2.9], flamer: [1.0, 3.25], flamer2: [1.0, 4.35], flamer3: [1.0, 5.45],
  muret: [-1.15, 0], repair: [-1.7, -1.0], hesco: [-2.3, 0], casemate: [-3.45, 0], blinde: [-4.6, 0], mRock: [-5.75, 0], mWire: [-1.7, 1.0], mClay: [-2.85, 1.0], mMg: [-2.9, -1.0], mFlame: [-4.0, 1.0],
};
const GUX = 104, GUY = 112, GM = 80;
const GLABEL = { superTir: 'Super tir', arty: 'Frappe d\'artillerie', repair: 'Réparation d\'urgence', mgnest: 'Nid de mitrailleuse', muret: 'Double muret', mWire: 'Couronne de barbelés', mClay: 'Claymore', mMg: 'Mitrailleuse 12,7', mFlame: 'Lance-flammes fixe', mRock: 'Roquettes auto', blinde: 'Bastion blindé', m2flame: 'Lance-flammes M2', flamer: 'Tour lance-flammes', hesco: 'Bastion HESCO', casemate: 'Casemate béton' };
const GMIN_X = Math.min(...Object.values(GPOS).map(p => p[0])), GMIN_Y = Math.min(...Object.values(GPOS).map(p => p[1]));
const gpx = id => [(GPOS[id][0] - GMIN_X) * GUX + GM, (GPOS[id][1] - GMIN_Y) * GUY + GM];
const ICON_OF = n => n.kind === 'tech' ? n.ref : n.id;
const nodeVisible = n => n.id === ROOT || (rootOwned() && owned(NODE[n.parent]));

function treeViewApply() {
  const v = G.tv; $('treeWorld').style.transform = `translate(${v.x}px,${v.y}px) scale(${v.s})`;
}
function treeCenter(id) {
  const view = $('treeView'), r = view.getBoundingClientRect();
  const [px, py] = gpx(id || ROOT);
  G.tv.x = r.width / 2 - px * G.tv.s; G.tv.y = r.height * 0.45 - py * G.tv.s;
  treeViewApply();
}
function treeZoom(f, cx, cy) {
  const view = $('treeView'), r = view.getBoundingClientRect();
  if (cx === undefined) { cx = r.width / 2; cy = r.height / 2; }
  const s0 = G.tv.s, s1 = clamp(s0 * f, 0.45, 1.9);
  const wx = (cx - G.tv.x) / s0, wy = (cy - G.tv.y) / s0;
  G.tv.s = s1; G.tv.x = cx - wx * s1; G.tv.y = cy - wy * s1;
  treeViewApply();
}
function renderTree() {
  $('tree').classList.toggle('hide', !G.treeOpen);
  if (!G.treeOpen) return;
  $('treeMoney').textContent = fmt(G.money);
  const vis = TREE.filter(nodeVisible);
  let edges = '', nodes = '';
  vis.forEach(n => {
    if (!n.parent || !nodeVisible(NODE[n.parent])) return;
    const [x1, y1] = gpx(n.parent), [x2, y2] = gpx(n.id), own = owned(n);
    edges += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${own ? '#c8b273' : '#59605f'}" stroke-width="${own ? 3 : 2}" ${own ? '' : 'stroke-dasharray="6 5"'}/>`;
  });
  vis.forEach(n => {
    const [x, y] = gpx(n.id), own = owned(n), av = nodeAvailable(n);
    const cls = own ? 'own' : av ? 'av' : 'lock';
    const fresh = !G.treeSeen[n.id];
    G.treeSeen[n.id] = 1;
    nodes += `<div class="gnode ${cls} ${n.id === ROOT ? 'root' : ''} ${G.treeSel === n.id ? 'sel' : ''} ${fresh ? 'new' : ''}" style="left:${x}px;top:${y}px" data-id="${n.id}">` +
      `<img src="${icon(ICON_OF(n))}" alt="">` +
      (own ? (n.kind === 'module' || n.kind === 'bonus' ? `<span class="glv">${nodeLevel(n)}/3</span>` : '') : `<span class="gcost">${fmt(nodeCost(n))}</span>`) +
      (!own && !av ? '<span class="glk"></span>' : '') +
      (n.kind === 'tech' ? `<span class="grom">${n.lv === 1 ? 'II' : 'III'}</span>` : '') + `<span class="glab">${GLABEL[n.id] || shortName(n)}</span></div>`;
  });
  const maxX = (Math.max(...Object.values(GPOS).map(p => p[0])) - GMIN_X) * GUX + GM * 2;
  const maxY = (Math.max(...Object.values(GPOS).map(p => p[1])) - GMIN_Y) * GUY + GM * 2;
  $('treeEdges').setAttribute('width', maxX); $('treeEdges').setAttribute('height', maxY);
  $('treeEdges').innerHTML = edges;
  $('treeNodes').innerHTML = nodes;
  if (!G.tvInit) { G.tvInit = true; requestAnimationFrame(() => treeCenter(ROOT)); } else treeViewApply();
  // fiche détail
  const sh = $('treeSheet');
  const sel = G.treeSel && NODE[G.treeSel];
  if (sel && nodeVisible(sel)) {
    const lv = nodeLevel(sel), own = lv > 0, av = nodeAvailable(sel);
    sh.innerHTML = `<div class="shead"><img src="${icon(ICON_OF(sel))}" alt=""><div><b>${nodeName(sel)}</b><div class="note">${own ? (sel.kind === 'module' || sel.kind === 'bonus' ? 'Acquis · rang ' + lv + '/3' : 'Acquis') : av ? 'Disponible : ' + fmt(nodeCost(sel)) : 'Verrouillé'}</div></div><button class="btn" data-act="treeSel" data-id="${sel.id}">Fermer</button></div>` + treeDetail(sel);
  } else {
    sh.innerHTML = `<div class="hint" style="margin:0">${rootOwned() ? 'Touchez un élément. Les éléments en gris sont les prochains achats possibles ; le reste se dévoile à mesure que vous avancez.' : 'Un seul choix pour commencer : le nid de mitrailleuse, au centre. Touchez-le.'}</div>`;
  }
  refreshAfford(true);
}

// déplacement et zoom au doigt
const TV = { pts: new Map(), moved: false, start: null, pinch: null };
function treeInput() {
  const view = $('treeView');
  view.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    view.setPointerCapture(e.pointerId);
    TV.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (TV.pts.size === 1) { TV.moved = false; TV.start = { x: e.clientX, y: e.clientY, tx: G.tv.x, ty: G.tv.y }; }
    else if (TV.pts.size === 2) {
      const [a, b] = [...TV.pts.values()], r = view.getBoundingClientRect();
      TV.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: G.tv.s, cx: (a.x + b.x) / 2 - r.left, cy: (a.y + b.y) / 2 - r.top, tx: G.tv.x, ty: G.tv.y };
      TV.moved = true;
    }
  });
  view.addEventListener('pointermove', e => {
    if (!TV.pts.has(e.pointerId)) return;
    TV.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (TV.pts.size === 1 && TV.start) {
      const dx = e.clientX - TV.start.x, dy = e.clientY - TV.start.y;
      if (Math.hypot(dx, dy) > 7) TV.moved = true;
      if (TV.moved) { G.tv.x = TV.start.tx + dx; G.tv.y = TV.start.ty + dy; treeViewApply(); }
    } else if (TV.pts.size === 2 && TV.pinch) {
      const [a, b] = [...TV.pts.values()], P = TV.pinch;
      const s1 = clamp(P.s * Math.hypot(a.x - b.x, a.y - b.y) / P.d, 0.45, 1.9);
      const wx = (P.cx - P.tx) / P.s, wy = (P.cy - P.ty) / P.s;
      G.tv.s = s1; G.tv.x = P.cx - wx * s1; G.tv.y = P.cy - wy * s1; treeViewApply();
    }
  });
  const end = e => {
    if (!TV.pts.has(e.pointerId)) return;
    TV.pts.delete(e.pointerId);
    if (TV.pts.size === 1) { const p = [...TV.pts.values()][0]; TV.start = { x: p.x, y: p.y, tx: G.tv.x, ty: G.tv.y }; TV.pinch = null; return; }
    if (TV.pts.size === 0) {
      if (!TV.moved && e.type === 'pointerup') {
        const el = document.elementFromPoint(e.clientX, e.clientY), nd = el && el.closest('.gnode');
        if (nd) act('treeSel', { id: nd.dataset.id });
        else if (G.treeSel) { G.treeSel = null; renderTree(); }
      }
      TV.start = null; TV.pinch = null;
    }
  };
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);
  view.addEventListener('wheel', e => { e.preventDefault(); const r = view.getBoundingClientRect(); treeZoom(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
}

/* =========================================================
   RENDU CANVAS : vue 3/4 de nuit
   Le sol est légèrement écrasé verticalement (inclinaison de caméra) ;
   les objets en relief sont dessinés debout et triés en profondeur.
   ========================================================= */
const K = 0.8, TOP = 50;
const SH = Math.round(H * K + TOP + 6);
const PY = (y, h) => y * K + TOP - (h || 0);
const HERO_H = [0, 5, 20, 30, 52];
const roofH = () => HERO_H[G.bunkerLv];
const heroH = () => HERO_H[G.bunkerLv] + 13;
let VIEW = { sc: 1, dpr: 1, bx: 0, by: 0 };
let VK = 1, OX = 0, OY = 0, lightDirty = true;
function fit() {
  const r = stage.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const sc = Math.min(r.width / W, r.height / SH);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.round(r.width), ch = Math.round(r.height);
  const bx = Math.round((cw - W * sc) / 2), by = Math.round((ch - SH * sc) / 2);
  if (cv.style.width !== cw + 'px' || cv.style.height !== ch + 'px' || VIEW.dpr !== dpr || VIEW.bx !== bx || VIEW.by !== by) {
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    lightDirty = true;
  }
  VIEW = { sc, dpr, bx, by };
  placeSlotMenu(); positionGates();
}
const groundT = () => ctx.setTransform(VK, 0, 0, VK * K, OX, OY + TOP * VK);
const screenT = () => ctx.setTransform(VK, 0, 0, VK, OX, OY);

// Générateur pseudo-aléatoire déterministe pour le décor
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const MX = 80, MY = 220;
const BG = document.createElement('canvas'); BG.width = (W + 2 * MX) * 2; BG.height = (H + 2 * MY) * 2;
const DEC = document.createElement('canvas'); DEC.width = W * 2; DEC.height = H * 2;
const dctx = DEC.getContext('2d'); dctx.scale(2, 2);
function clearDecals() { dctx.clearRect(0, 0, W, H); }
function blood(x, y, r, green) {
  dctx.fillStyle = green ? 'rgba(80,110,30,0.45)' : 'rgba(85,14,12,0.5)';
  for (let i = 0; i < 4; i++) { dctx.beginPath(); dctx.arc(x + (rand() - 0.5) * r * 1.6, y + (rand() - 0.5) * r * 1.6, r * (0.25 + rand() * 0.45), 0, Math.PI * 2); dctx.fill(); }
}
function scorch(x, y, r) { const g = dctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(10,8,6,0.45)'); g.addColorStop(1, 'rgba(10,8,6,0)'); dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill(); }
setInterval(() => { if (!G || G.paused) return; dctx.save(); dctx.globalCompositeOperation = 'destination-out'; dctx.fillStyle = 'rgba(0,0,0,0.05)'; dctx.fillRect(0, 0, W, H); dctx.restore(); }, 1500);

/* ---------- Décor statique : lampadaires, épaves, portails ---------- */
const LAMPS = [], DECOR = [], GATES = [];
function genScene() {
  const R = mulberry(4242);
  const nearB = (c, r) => Math.abs(c - BC.c) <= 1 && Math.abs(r - BC.r) <= 1;
  const free = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS && !PATH_CELLS.has(c + ',' + r) && !SLOT_SET.has(c + ',' + r) && !nearB(c, r);
  const cand = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    if (!free(c, r)) continue;
    for (const [dc, dr] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) if (PATH_CELLS.has((c + dc) + ',' + (r + dr))) { cand.push({ c, r, dc, dr }); break; }
  }
  for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  const used = new Set();
  for (const q of cand) {
    if (LAMPS.length >= 13) break;
    if (LAMPS.some(l => Math.hypot(l.c - q.c, l.r - q.r) < 2.6)) continue;
    const x = q.c * T + T / 2 + q.dc * 13, y = q.r * T + T / 2 + q.dr * 13;
    LAMPS.push({ c: q.c, r: q.r, x, y, lx: x + q.dc * 18, ly: y + q.dr * 18, dc: q.dc, dr: q.dr });
    used.add(q.c + ',' + q.r);
  }
  const fc = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) if (free(c, r) && !used.has(c + ',' + r)) fc.push([c, r]);
  for (let i = 0; i < 10 && fc.length; i++) {
    const [c, r] = fc.splice(Math.floor(R() * fc.length), 1)[0];
    const kind = ['car', 'tree', 'barrels', 'car', 'tree', 'rubble', 'car', 'barrels', 'tree', 'rubble'][i];
    DECOR.push({ kind, x: c * T + T / 2 + (R() - 0.5) * 8, y: r * T + T / 2 + (R() - 0.5) * 8, rot: R() < 0.5, s: R() });
  }
  PATHS.forEach(p => {
    const a = p.pts[0], b = p.pts[1];
    const dx = Math.sign(b.x - a.x), dy = Math.sign(b.y - a.y);
    let ex = a.x, ey = a.y;
    if (dy > 0) ey = 4; else if (dy < 0) ey = H - 4; else if (dx < 0) ex = W - 4; else ex = 4;
    GATES.push({ p, x: ex, y: ey, vertical: dy !== 0 });
  });
}

/* ---------- Sol (pré-calculé) ---------- */
function genBG() {
  const b = BG.getContext('2d'); b.setTransform(2, 0, 0, 2, MX * 2, MY * 2);
  const R = mulberry(20261126);
  b.fillStyle = '#2b2721'; b.fillRect(-MX, -MY, W + 2 * MX, H + 2 * MY);
  for (let i = 0; i < 150; i++) {
    const x = -MX + R() * (W + 2 * MX), y = -MY + R() * (H + 2 * MY), r = 14 + R() * 46;
    const col = R() < 0.45 ? '64,52,38' : (R() < 0.5 ? '20,18,15' : '78,66,48');
    const g = b.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},0.55)`); g.addColorStop(1, `rgba(${col},0)`);
    b.fillStyle = g; b.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 3200; i++) { b.fillStyle = R() < 0.55 ? 'rgba(14,12,10,0.4)' : 'rgba(95,84,62,0.2)'; b.fillRect(-MX + R() * (W + 2 * MX), -MY + R() * (H + 2 * MY), 1 + R() * 1.6, 1 + R() * 1.6); }
  const strokeAll = (w, col, dash) => {
    b.strokeStyle = col; b.lineWidth = w; b.lineCap = 'butt'; b.lineJoin = 'round'; b.setLineDash(dash || []);
    PATHS.forEach(p => {
      const a = p.pts[0], n = p.pts[1], l = Math.hypot(a.x - n.x, a.y - n.y) || 1;
      b.beginPath(); b.moveTo(a.x + (a.x - n.x) / l * 300, a.y + (a.y - n.y) / l * 300);
      p.pts.forEach(pt => b.lineTo(pt.x, pt.y)); b.stroke();
    });
    b.setLineDash([]);
  };
  strokeAll(T * 1.02, '#16171b');
  strokeAll(T * 0.92, '#5b606c');
  strokeAll(T * 0.84, '#2b2f39');
  // place autour du bastion
  b.fillStyle = '#16171b'; b.fillRect(BX - 36, BY - 36, 72, 72);
  b.fillStyle = '#5b606c'; b.fillRect(BX - 34, BY - 34, 68, 68);
  b.fillStyle = '#2f333d'; b.fillRect(BX - 31, BY - 31, 62, 62);
  strokeAll(T * 0.72, '#454a56'); strokeAll(T * 0.7, '#2b2f39');
  b.fillStyle = '#2f333d'; b.fillRect(BX - 31, BY - 31, 62, 62);
  PATH_CELLS.forEach((_, k) => {
    const [c, r] = k.split(',').map(Number);
    for (let i = 0; i < 7; i++) { b.fillStyle = R() < 0.65 ? 'rgba(16,17,22,0.5)' : 'rgba(130,134,145,0.12)'; b.beginPath(); b.ellipse(c * T + 6 + R() * (T - 12), r * T + 6 + R() * (T - 12), 1 + R() * 3.2, 1 + R() * 2, 0, 0, Math.PI * 2); b.fill(); }
  });
  strokeAll(1.6, 'rgba(205,196,150,0.6)', [9, 9]);
  // emplacements de pièges peints sur la route
  TRAP_SLOTS.forEach(([c, r]) => {
    const x = c * T, y = r * T;
    b.fillStyle = 'rgba(214,184,92,0.07)'; b.fillRect(x + 5, y + 5, T - 10, T - 10);
    b.strokeStyle = 'rgba(214,184,92,0.75)'; b.lineWidth = 1.4; b.setLineDash([4, 3]); b.strokeRect(x + 5.5, y + 5.5, T - 11, T - 11); b.setLineDash([]);
    b.fillStyle = 'rgba(214,184,92,0.8)';
    [[x + 5, y + 5], [x + T - 9, y + 5], [x + 5, y + T - 9], [x + T - 9, y + T - 9]].forEach(([px, py]) => b.fillRect(px, py, 4, 4));
  });
  // gravats au sol
  DECOR.filter(d => d.kind === 'rubble').forEach(d => {
    for (let j = 0; j < 9; j++) { b.fillStyle = R() < 0.5 ? '#4a4944' : '#36352f'; b.fillRect(d.x + (R() - 0.5) * 24, d.y + (R() - 0.5) * 20, 2 + R() * 5, 2 + R() * 4); }
  });
  // emplacements de tours : dalles béton balisées
  SLOTS.forEach(([c, r]) => {
    const x = c * T, y = r * T;
    b.fillStyle = 'rgba(0,0,0,0.4)'; b.fillRect(x + 5, y + 6, T - 9, T - 9);
    b.fillStyle = '#585a55'; b.fillRect(x + 4, y + 4, T - 8, T - 8);
    b.strokeStyle = '#33342f'; b.lineWidth = 1; b.strokeRect(x + 4.5, y + 4.5, T - 9, T - 9);
    b.strokeStyle = 'rgba(120,120,110,0.5)'; b.beginPath(); b.moveTo(x + 9, y + 15); b.lineTo(x + 18, y + 13); b.moveTo(x + 24, y + 28); b.lineTo(x + 31, y + 25); b.stroke();
    b.strokeStyle = '#d6b85c'; b.lineWidth = 2.2; const L = 7, m = 6;
    [[x + m, y + m, 1, 1], [x + T - m, y + m, -1, 1], [x + m, y + T - m, 1, -1], [x + T - m, y + T - m, -1, -1]].forEach(([px, py, sx, sy]) => {
      b.beginPath(); b.moveTo(px, py + sy * L); b.lineTo(px, py); b.lineTo(px + sx * L, py); b.stroke();
    });
  });
}

/* ---------- Primitives ---------- */
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function shadowAt(x, y, rx) { ctx.fillStyle = 'rgba(0,0,0,0.4)'; ell(x + 2, PY(y) + 1, rx, rx * 0.45); ctx.fill(); }
function bag(x, sy) { ctx.fillStyle = '#a48f60'; ctx.strokeStyle = '#5c4e33'; ctx.lineWidth = 0.8; ell(x, sy, 4.4, 3); ctx.fill(); ctx.stroke(); }
function bagRing(cx, cy, rad, rows, half) {
  const n = Math.max(8, Math.round(rad * 0.72));
  for (let row = 0; row < rows; row++) {
    const list = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + row * 0.35, s = Math.sin(a); if ((half === 'back') === (s < 0)) list.push(a); }
    list.sort((a, b) => Math.sin(a) - Math.sin(b));
    list.forEach(a => bag(cx + Math.cos(a) * rad, PY(cy + Math.sin(a) * rad, 3 + row * 5.2)));
  }
}
function box3(x0, x1, y0, y1, h0, h1, front, top) {
  ctx.fillStyle = front; ctx.fillRect(x0, PY(y1, h1), x1 - x0, h1 - h0);
  ctx.fillStyle = top; ctx.fillRect(x0, PY(y0, h1), x1 - x0, (y1 - y0) * K);
}
const scrDir = a => { const ux = Math.cos(a), uy = Math.sin(a) * K, n = Math.hypot(ux, uy) || 1; return [ux / n, uy / n]; };

// petit soldat debout ; retourne le point d'épaule
function soldier(x, y, h, face, s, body) {
  const by = PY(y, h);
  ctx.strokeStyle = '#2a2f22'; ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
  seg(x - 1.6 * s, by - 6 * s, x - 2 * s, by); seg(x + 1.6 * s, by - 6 * s, x + 2 * s, by);
  ctx.fillStyle = body || '#4f5d3a'; ell(x, by - 9.5 * s, 3.6 * s, 4.6 * s); ctx.fill();
  ctx.fillStyle = '#3a4429'; ctx.fillRect(x - 3 * s, by - 10 * s, 6 * s, 2.4 * s);
  ctx.fillStyle = '#c69f7c'; ell(x + face * 0.6 * s, by - 15.5 * s, 2.3 * s, 2.3 * s); ctx.fill();
  ctx.fillStyle = '#4a5733'; ctx.beginPath(); ctx.arc(x + face * 0.4 * s, by - 16.3 * s, 2.9 * s, Math.PI, 0); ctx.fill();
  return [x + face * 1.5 * s, by - 11.5 * s];
}

/* ---------- Lampadaires, décor, portails ---------- */
function drawLamp(l) {
  const x = l.x, y = l.y, top = PY(y, 32), ax = l.x + l.dc * 11, ay = PY(l.y + l.dr * 11, 32);
  shadowAt(x, y, 3);
  ctx.strokeStyle = '#1c1e22'; ctx.lineWidth = 2.2; seg(x, PY(y), x, top);
  ctx.lineWidth = 1.6; seg(x, top, ax, ay);
  ctx.fillStyle = '#2a2c30'; ctx.fillRect(ax - 3.5, ay - 1.5, 7, 3.5);
  ctx.fillStyle = '#ffe3a0'; ctx.fillRect(ax - 2.5, ay + 1.5, 5, 1.6);
}
function drawDecor(d) {
  const x = d.x, y = d.y;
  if (d.kind === 'car') {
    const hx = d.rot ? 13 : 7, hy = d.rot ? 7 : 12;
    shadowAt(x, y, 15);
    box3(x - hx, x + hx, y - hy, y + hy, 2, 8, '#4a2f22', '#6a4430');
    box3(x - hx * 0.55, x + hx * 0.55, y - hy * 0.5, y + hy * 0.5, 8, 13, '#1c1d20', '#5a3a28');
    ctx.fillStyle = '#121214'; ctx.fillRect(x - hx + 2, PY(y + hy, 3), 4, 3); ctx.fillRect(x + hx - 6, PY(y + hy, 3), 4, 3);
  } else if (d.kind === 'tree') {
    shadowAt(x, y, 6);
    ctx.strokeStyle = '#2c2318'; ctx.lineWidth = 2.6; seg(x, PY(y), x, PY(y, 26));
    ctx.lineWidth = 1.4;
    [[-9, 34, -4, 22], [8, 32, 3, 20], [-6, 30, 0, 28], [10, 26, 2, 16], [-11, 24, -1, 14]].forEach(([dx, h2, dx1, h1]) => seg(x + dx1, PY(y, h1), x + dx, PY(y, h2)));
  } else if (d.kind === 'barrels') {
    shadowAt(x, y, 9);
    [[-5, -2, '#7a3a22'], [4, -3, '#4d5a33'], [0, 4, '#7a3a22']].forEach(([dx, dy, c]) => {
      const bx = x + dx, by = y + dy;
      ctx.fillStyle = c; ctx.fillRect(bx - 3.5, PY(by, 10), 7, 10);
      ctx.fillStyle = shade(c, 25); ell(bx, PY(by, 10), 3.5, 1.6); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(bx - 3.5, PY(by, 6), 7, 1);
    });
  }
}
function drawGate(g) {
  const open = g.p.opens <= (G.mode === 'wave' ? G.wave : G.wave + 1);
  const meshFill = 'rgba(150,160,166,0.14)', meshLine = 'rgba(175,185,190,0.5)';
  ctx.strokeStyle = '#2a2c30'; ctx.lineWidth = 2;
  if (g.vertical) {
    const xs = open ? [[g.x - 34, g.x - 19], [g.x + 19, g.x + 34]] : [[g.x - 19, g.x + 19]];
    xs.forEach(([x0, x1]) => {
      const t0 = PY(g.y, 20), b0 = PY(g.y);
      ctx.fillStyle = meshFill; ctx.fillRect(x0, t0, x1 - x0, b0 - t0);
      ctx.save(); ctx.beginPath(); ctx.rect(x0, t0, x1 - x0, b0 - t0); ctx.clip();
      ctx.strokeStyle = meshLine; ctx.lineWidth = 0.6;
      for (let k = -30; k < x1 - x0 + 30; k += 4) { seg(x0 + k, b0, x0 + k + 20, t0); seg(x0 + k, t0, x0 + k + 20, b0); }
      ctx.restore();
      ctx.strokeStyle = '#2a2c30'; ctx.lineWidth = 2.2; seg(x0, b0, x0, t0 - 2); seg(x1, b0, x1, t0 - 2); ctx.lineWidth = 1.4; seg(x0, t0, x1, t0);
    });
    if (!open) { ctx.fillStyle = (Math.sin(G.time * 5) > 0) ? '#ff3b2e' : '#5a1510'; ell(g.x - 19, PY(g.y, 24), 2, 2); ctx.fill(); }
  } else {
    const y0 = open ? g.y + 19 : g.y - 19, y1 = g.y + 19;
    const x = g.x;
    ctx.strokeStyle = '#2a2c30'; ctx.lineWidth = 2.2; seg(x, PY(g.y - 19), x, PY(g.y - 19, 22)); seg(x, PY(g.y + 19), x, PY(g.y + 19, 22));
    if (!open) {
      ctx.fillStyle = meshFill; ctx.beginPath(); ctx.moveTo(x - 2, PY(y0)); ctx.lineTo(x + 2, PY(y1)); ctx.lineTo(x + 2, PY(y1, 20)); ctx.lineTo(x - 2, PY(y0, 20)); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = meshLine; ctx.lineWidth = 0.8; for (let h = 3; h < 20; h += 4) seg(x, PY(y0, h), x, PY(y1, h));
      ctx.fillStyle = (Math.sin(G.time * 5) > 0) ? '#ff3b2e' : '#5a1510'; ell(x, PY(g.y - 19, 26), 2, 2); ctx.fill();
    }
  }
}

/* ---------- Pièges (au sol) ---------- */
function drawTrap(d) {
  const x = d.x, y = d.y, lv = d.lv;
  if (d.type === 'wire') {
    ctx.strokeStyle = lv === 2 ? '#c5cacc' : '#9aa0a3'; ctx.lineWidth = lv === 2 ? 1.3 : 1;
    const rows = lv + 2;
    for (let j = 0; j < rows; j++) {
      const yy = y - 12 + j * (24 / (rows - 1));
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(x - 14 + i * 7, yy, 4.2, 4.8, 0, 0, Math.PI * 2); ctx.stroke(); }
    }
    ctx.fillStyle = '#3b2c1e'; ctx.fillRect(x - 18, y - 14, 3, 28); ctx.fillRect(x + 15, y - 14, 3, 28);
  } else if (d.type === 'mine') {
    const ready = d.cd <= 0, rr = 5 + lv * 1.6;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(x + 1, y + 1.5, rr + 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ready ? (lv === 2 ? '#4b5a33' : '#3f4a2c') : '#2a2d26'; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1e231a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = ready ? '#e0402f' : '#555'; ctx.beginPath(); ctx.arc(x, y, 1.9, 0, Math.PI * 2); ctx.fill();
  } else if (d.type === 'ditch') {
    ctx.fillStyle = '#0f0d09'; ctx.fillRect(x - 18, y - 14, 36, 28);
    ctx.fillStyle = '#2a2219'; ctx.fillRect(x - 18, y - 14, 36, 7);
    if (lv >= 1) { ctx.strokeStyle = '#8a6a42'; ctx.lineWidth = 1.6; for (let i = 0; i < 7; i++) { const xx = x - 15 + i * 5; seg(xx, y + 10, xx + 2, y - 4); } }
    if (lv === 2) for (let i = 0; i < 5; i++) { ctx.fillStyle = `rgba(255,${110 + Math.floor(rand() * 90)},30,${0.4 + rand() * 0.35})`; ctx.beginPath(); ctx.arc(x - 13 + rand() * 26, y - 6 + rand() * 16, 2 + rand() * 3.5, 0, Math.PI * 2); ctx.fill(); }
  }
}

/* ---------- Tours (debout) ---------- */
function drawTower(d) {
  const x = d.x, y = d.y, lv = d.lv;
  const [ux, uy] = scrDir(d.ang), face = ux >= 0 ? 1 : -1;
  shadowAt(x, y, 15);
  if (d.type === 'mgnest' || d.type === 'mortar') {
    const rows = d.type === 'mgnest' ? 2 : 1;
    bagRing(x, y, 12, rows, 'back');
    if (d.type === 'mgnest') {
      const [sx, sy] = soldier(x - face * 2, y - 2, 0, face, 0.85);
      const gx = x + face * 1, gy = PY(y, 11), L = 12 + lv * 3;
      ctx.strokeStyle = '#121314'; ctx.lineWidth = lv === 2 ? 3.2 : 2.2; ctx.lineCap = 'round';
      seg(gx - ux * 3, gy - uy * 3, gx + ux * L, gy + uy * L);
      if (lv === 1) seg(gx - ux * 2 - uy * 2.6, gy - uy * 2 + ux * 2.6, gx + ux * (L - 1) - uy * 2.6, gy + uy * (L - 1) + ux * 2.6);
      if (lv === 2) { ctx.fillStyle = '#3d4246'; ctx.fillRect(gx + ux * 4 - 3.5, gy - 6, 7, 8); }
      if (d.flash > 0) { ctx.fillStyle = '#ffd37a'; ell(gx + ux * (L + 2), gy + uy * (L + 2), 3, 3); ctx.fill(); }
    } else {
      ctx.fillStyle = '#2b2d2c'; ell(x, PY(y, 4), 6, 2.6); ctx.fill();
      ctx.strokeStyle = '#3a3f42'; ctx.lineWidth = 3.6 + lv; ctx.lineCap = 'butt';
      seg(x, PY(y, 5), x + ux * 6, PY(y, 22 + lv * 2) + uy * 2);
      ctx.lineCap = 'round';
      if (d.flash > 0) { ctx.fillStyle = '#ffd37a'; ell(x + ux * 6, PY(y, 25 + lv * 2), 4, 4); ctx.fill(); }
    }
    bagRing(x, y, 12, rows, 'front');
  } else if (d.type === 'sniper') {

/* ---------- Image complète ---------- */
function draw() {
  const { sc, dpr } = VIEW;
  VK = sc * dpr;
  OX = VIEW.bx * dpr + (G.shake > 0 ? (rand() - 0.5) * G.shake * VK : 0); OY = VIEW.by * dpr + (G.shake > 0 ? (rand() - 0.5) * G.shake * VK : 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#2b2721'; ctx.fillRect(0, 0, cv.width, cv.height);
  const next = G.mode === 'wave' ? G.wave : G.wave + 1;

  // 1. Sol
  groundT();
  ctx.drawImage(BG, -MX, -MY, W + 2 * MX, H + 2 * MY);
  ctx.drawImage(DEC, 0, 0, W, H);
  PATHS.forEach(p => {
    if (p.opens <= next) return;
    ctx.strokeStyle = 'rgba(5,6,8,0.55)'; ctx.lineWidth = T * 0.9; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    const a0 = p.pts[0], n0 = p.pts[1], l0 = Math.hypot(a0.x - n0.x, a0.y - n0.y) || 1;
    ctx.beginPath(); ctx.moveTo(a0.x + (a0.x - n0.x) / l0 * 300, a0.y + (a0.y - n0.y) / l0 * 300); p.pts.slice(0, -1).forEach(pt => ctx.lineTo(pt.x, pt.y)); ctx.stroke();
  });
  G.defs.forEach(d => { if (DEF[d.type].place === 'path') drawTrap(d); });
  if (G.mods.wire) {
    const L = MODULES.wire.levels[G.mods.wire - 1];
    ctx.strokeStyle = 'rgba(175,180,184,0.8)'; ctx.lineWidth = 0.9;
    for (let ring = 0; ring < G.mods.wire; ring++) {
      const rr = L.r - ring * 5; ctx.beginPath();
      for (let i = 0; i <= 80; i++) { const a = i / 80 * Math.PI * 2, o = i % 2 ? 2.6 : -2.6; const px = BX + Math.cos(a) * (rr + o), py = BY + Math.sin(a) * (rr + o); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
    }
  }
  for (const b of G.booms) { const k = b.t / b.life; ctx.fillStyle = `rgba(255,${Math.round(190 - 110 * k)},70,${0.45 * (1 - k)})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.4 + 0.7 * k), 0, Math.PI * 2); ctx.fill(); }

  // 2. Objets debout, triés en profondeur
  screenT();
  const list = [];
  LAMPS.forEach(l => list.push([l.y, () => drawLamp(l)]));
  DECOR.forEach(d => { if (d.kind !== 'rubble') list.push([d.y, () => drawDecor(d)]); });
  GATES.forEach(g => list.push([g.y + (g.vertical ? 0 : 19), () => drawGate(g)]));
  G.defs.forEach(d => { if (DEF[d.type].place === 'side') list.push([d.y, () => drawTower(d)]); });
  list.push([BY + 23, drawBunker]);
  for (const z of G.zombies) if (!z.dead) list.push([z.y, () => drawZombie(z)]);
  list.sort((a, b) => a[0] - b[0]);
  for (const it of list) it[1]();
  // silhouettes des zombies cachés derrière le bastion
  if (G.bunkerLv >= 2) {
    ctx.globalAlpha = 0.4;
    for (const z of G.zombies) if (!z.dead && z.y < BY - 16 && Math.abs(z.x - BX) < 30) drawZombie(z, true);
    ctx.globalAlpha = 1;
  }

  // 3. Projectiles, traçantes, particules
  for (const p of G.projs) {
    if (p.t < 0) continue;
    const k2 = clamp(p.t / p.dur, 0, 1), x = p.sx + (p.tx - p.sx) * k2, y = p.sy + (p.ty - p.sy) * k2;
    const h0 = p.h0 || 0, h1 = p.h1 || 0;
    const h = h0 + (h1 - h0) * k2 + (p.type === 'shell' ? Math.sin(Math.PI * k2) * 60 : p.type === 'gren' ? Math.sin(Math.PI * k2) * 18 : 0);
    if (p.type === 'shell') {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ell(x, PY(y), 2.5, 1.2); ctx.fill();
      ctx.fillStyle = '#2b2b2b'; ell(x, PY(y, h), 2.6, 2.6); ctx.fill();
    } else if (p.type === 'spit') { ctx.fillStyle = '#9be05a'; ell(x, PY(y, h), 3, 3); ctx.fill(); }
    else if (p.type === 'gren') { ctx.fillStyle = '#4a4f3a'; ell(x, PY(y, h), 2.6, 2.6); ctx.fill(); }
    else {
      const a = Math.atan2(PY(p.ty, h1) - PY(p.sy, h0), p.tx - p.sx);
      ctx.save(); ctx.translate(x, PY(y, h)); ctx.rotate(a); ctx.fillStyle = '#d8d2c0'; ctx.fillRect(-5, -1.5, 9, 3); ctx.fillStyle = '#ffb347'; ctx.fillRect(-8, -1.2, 3, 2.4); ctx.restore();
    }
  }
  ctx.lineCap = 'round';
  for (const t of G.tracers) { ctx.strokeStyle = t.c; ctx.globalAlpha = 1 - t.t / t.life; ctx.lineWidth = t.w; seg(t.x1, PY(t.y1, t.h1 || 10), t.x2, PY(t.y2, 9)); }
  ctx.globalAlpha = 1;
  for (const p of G.parts) {
    const k4 = p.t / p.life;
    ctx.globalAlpha = p.kind === 'smoke' ? 0.45 * (1 - k4) : 1 - k4;
    ctx.fillStyle = p.c;
    const s = p.kind === 'smoke' ? p.s * (1 + k4 * 1.5) : p.kind === 'flame' ? p.s * (1 + k4 * 2) : p.s;
    const h = (p.h0 || 0) * (1 - k4) + (p.kind === 'smoke' ? k4 * 26 : p.kind === 'fire' ? 8 + k4 * 12 : 0);
    ctx.beginPath(); ctx.arc(p.x, PY(p.y, h), s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 4. Nuit et lumières
  drawLights();

  // 5. Repères d'interface (lisibles par-dessus la nuit)
  screenT();
  ctx.font = '700 11px system-ui'; ctx.textAlign = 'center';
  for (const t of G.texts) { ctx.globalAlpha = 1 - t.t / t.life; ctx.fillStyle = '#e8d18a'; ctx.fillText(t.s, t.x, PY(t.y, 24)); }
  ctx.globalAlpha = 1;
  if (G.mode === 'wave') drawGauges();
  PATHS.forEach(p => {
    if (p.opens <= next) return;
    const g = GATES[p.idx];
    ctx.fillStyle = 'rgba(225,215,185,0.9)'; ctx.font = '600 10px system-ui'; ctx.textAlign = 'center';
    const lx = clamp(g.x, 64, W - 64), ly = g.vertical ? (g.y < H / 2 ? PY(g.y, -18) : PY(g.y, 28)) : PY(g.y, 34);
    ctx.fillText(`Route ${p.name} : vague ${p.opens}`, lx, ly);
  });
  groundT();
  if (G.placing) {
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
      if (canPlace(G.placing, c, r)) { ctx.fillStyle = 'rgba(214,184,92,0.2)'; ctx.fillRect(c * T + 2, r * T + 2, T - 4, T - 4); ctx.strokeStyle = 'rgba(214,184,92,0.75)'; ctx.lineWidth = 1.4; ctx.strokeRect(c * T + 2.5, r * T + 2.5, T - 5, T - 5); }
    }
  }
  const showRange = (x, y, r, col) => { ctx.strokeStyle = col; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); };
  if (G.slotMenu) { const a = 0.55 + 0.45 * Math.sin(performance.now() / 160); ctx.strokeStyle = `rgba(214,184,92,${a})`; ctx.lineWidth = 2; ctx.setLineDash([5, 3]); ctx.strokeRect(G.slotMenu.c * T + 1.5, G.slotMenu.r * T + 1.5, T - 3, T - 3); ctx.setLineDash([]);
    const S = G.slotMenu, x = S.c * T + T / 2, y = S.r * T + T / 2;
    if (!S.def && S.pick) { const L = effL(S.pick, 0); if (L.range) showRange(x, y, L.range, 'rgba(214,184,92,0.95)'); if (L.min) showRange(x, y, L.min, 'rgba(227,160,143,0.8)'); if (S.pick === 'mine') showRange(x, y, L.r, 'rgba(255,170,80,0.9)'); }
    if (S.def && S.pick === 'up' && G.selected && DEF[G.selected.type].levels[G.selected.lv + 1]) { const L2 = effL(G.selected.type, G.selected.lv + 1); if (L2.range) showRange(G.selected.x, G.selected.y, L2.range, 'rgba(140,220,140,0.95)'); if (G.selected.type === 'mine') showRange(G.selected.x, G.selected.y, L2.r, 'rgba(140,220,140,0.95)'); }
  }
  if (G.selected) { const L = effL(G.selected.type, G.selected.lv); if (L.range) showRange(G.selected.x, G.selected.y, L.range, 'rgba(214,184,92,0.8)'); ctx.strokeStyle = '#d6b85c'; ctx.lineWidth = 1.6; ctx.strokeRect(G.selected.c * T + 1, G.selected.r * T + 1, T - 2, T - 2); }
  if (G.panelOpen && G.tab === 'bastion') showRange(BX, BY, ws(G.equipped).range, 'rgba(214,184,92,0.45)');
  screenT();
  if (G.focus && !G.focus.dead) {
    const f = G.focus, fx = f.x, fy = PY(f.y, f.r * 1.4), rr = f.r + 6 + Math.sin(G.time * 10) * 1.5;
    ctx.strokeStyle = '#ff4a3a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(fx, fy, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => { ctx.moveTo(fx + dx * (rr - 3), fy + dy * (rr - 3)); ctx.lineTo(fx + dx * (rr + 4), fy + dy * (rr + 4)); }); ctx.stroke();
  }
  if (G.aim === 'arty') { ctx.fillStyle = 'rgba(255,80,50,0.9)'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('Touchez la zone à pilonner', W / 2, PY(H, -4)); }
  if (G.paused && G.mode === 'wave') {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, cv.width, cv.height); screenT();
    ctx.fillStyle = '#e6e2d6'; ctx.font = '700 22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('PAUSE', W / 2, SH / 2);
  }
}

/* =========================================================
   BOUCLE PRINCIPALE
   ========================================================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (G.mode === 'wave' && !G.paused) {
    let sim = dt * G.speed;
    while (sim > 0 && G.mode === 'wave') { const s = Math.min(sim, 1 / 60); update(s); sim -= s; }
  } else if (G.mode !== 'wave') { G.time += dt; }
  if (!G.paused) updateFx(dt * (G.mode === 'wave' ? G.speed : 1));
  G.defs.forEach(d => { if (d.flash > 0) d.flash -= dt; if (d.on > 0) d.on -= dt; });
  draw();
  hudFrame();
  requestAnimationFrame(frame);
}

/* =========================================================
   EVENEMENTS
   ========================================================= */
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const sx = (e.clientX - r.left - VIEW.bx) / VIEW.sc, sy = (e.clientY - r.top - VIEW.by) / VIEW.sc;
  onTap(sx, (sy - TOP) / K, sx, sy);
});
panel.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset); });
$('weaponBar').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset); });
$('placeBar').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset); });
$('slotMenu').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset); });
['gates', 'gateTip', 'recap'].forEach(id => $(id).addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset); }));
$('bonusBar').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset); });
$('overlay').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset); });
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  SND.init();
  if (b.dataset.tab === 'arbre') { openTree(null); return; }
  const on = G.panelOpen && G.tab === 'bastion';
  G.panelOpen = !on; G.tab = 'bastion'; G.selected = null; G.slotMenu = null; G.gateTip = null; renderAll();
}));
$('tree').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset); });
$('btnWave').addEventListener('click', () => { SND.init(); startWave(); });
// fiche : glisser l'en-tête vers le bas pour la fermer
(() => {
  let y0 = null, dy = 0;
  panel.addEventListener('touchstart', e => { if (!e.target.closest('.shead') || e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; panel.classList.add('drag'); }, { passive: true });
  panel.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); panel.style.transform = `translateY(${dy}px)`; }, { passive: true });
  const end = () => {
    if (y0 === null) return;
    panel.classList.remove('drag'); panel.style.transform = ''; y0 = null;
    if (dy > 60) { if (G.tab === 'def') G.selected = null; G.panelOpen = false; renderAll(); }
  };
  panel.addEventListener('touchend', end); panel.addEventListener('touchcancel', end);
})();
$('btnSpeed').addEventListener('click', () => { G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1; renderButtons(); });
$('btnPause').addEventListener('click', () => { G.paused = !G.paused; renderButtons(); });
$('btnSound').addEventListener('click', () => { SND.init(); SND.on = !SND.on; renderButtons(); });
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.mode === 'wave' && !G.paused) { G.paused = true; renderButtons(); } });

/* =========================================================
   DEMARRAGE
   ========================================================= */
genScene();
genBG();
treeInput();
G = freshState();
renderAll();
showOverlay('title');
fit();
requestAnimationFrame(frame);

// Accès pour les tests automatisés
window.__DB = {
  get G() { return G; }, view: () => VIEW, newGame, startWave, update, act, ws, WEAPONS, DEF, MODULES, BUNKER_LV, PATHS, canPlace, addDef, buildWave, upCost, PATH_CELLS, SLOTS, SLOT_SET, TREE, NODE, buyNode, nodeAvailable, nodeLevel, upgradeInst, placeCost, openTree, closeTree, firepower, hordeBudget, DIR, TRAP_SLOTS, TRAP_SET, BONUS, useBonus, artyStrike, DIFF, VICTORY, refPower, advisedPower, earlyPrime, canEarly, statSources, TGT, renderAll, showOverlay, kill, MAG, GUN, firepower, advisedPower, bunkerMax, PACE, eff, GOALS, MENACE, completeGoal, seeded, todayKey, dailyMod, defeatHtml, openSlotMenu, openDefMenu, buildAt, CARDS, pickCard, makeDraft, effL, get META() { return META; }, PERKS, cardN,
};
})();
